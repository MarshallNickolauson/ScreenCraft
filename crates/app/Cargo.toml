[package]
name = "screencraft"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ScreenCraft: screen recording and editing, native"
default-run = "screencraft"

[[bin]]
name = "screencraft"
path = "src/main.rs"

[features]
default = []
vp9 = ["screencraft-encode/vp9"]

[dependencies]
screencraft-core = { path = "../core" }
screencraft-encode = { path = "../encode" }
screencraft-audio = { path = "../audio" }
screencraft-capture = { path = "../capture" }
screencraft-engine = { path = "../engine" }
screencraft-render = { path = "../render" }
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "wayland", "wgpu", "x11"] }
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
rfd = "0.17"
global-hotkey = "0.8"
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.17"
png = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
base64 = "0.22"
ureq = "2"
whisper-rs = "0.16"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }
muda = { version = "0.21", default-features = false }
winit = "0.30"
